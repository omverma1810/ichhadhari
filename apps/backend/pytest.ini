# ==============================================================================
# Pytest Configuration for Ichhadhari Dairy Management
# ==============================================================================
# This file configures pytest for running tests in the Django project.

[pytest]
# Django settings module
DJANGO_SETTINGS_MODULE = dairy.settings.test

# Python files and paths
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths = apps

# Additional options
addopts =
    --verbose
    --strict-markers
    --cov=apps
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80
    --reuse-db
    --nomigrations
    -ra
    --tb=short

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    api: API endpoint tests
    model: Model tests
    view: View tests
    serializer: Serializer tests
    permission: Permission tests
    middleware: Middleware tests
    celery: Celery task tests

# Coverage options
[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */factories.py
    */admin.py
    */apps.py
    */__init__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
